[project]
name = "analytics"
version = "0.0.0"
description = "Servicio analítico de ReqCanvas (OCR, detección y minería de texto)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "bullmq>=3.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "pytesseract>=0.3.13",
    "python-json-logger>=4.2.0",
    "redis>=7.4.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["analytics"]

[[tool.mypy.overrides]]
# Sin tipos publicados (feature 006).
module = ["bullmq", "bullmq.*", "pytesseract"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Grupo `mining` (feature 007): sin tipos publicados, y ausente en el entorno de `typecheck`.
module = [
    "spacy", "spacy.*", "sentence_transformers", "sklearn", "sklearn.*", "umap", "umap.*",
    "networkx", "networkx.*", "mlxtend", "mlxtend.*", "pysentimiento", "pysentimiento.*",
    "torch", "torch.*", "transformers", "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
mining = [
    "es-core-news-md",
    "mlxtend>=0.25.0",
    "networkx>=3.7",
    "pysentimiento>=0.7.3",
    "scikit-learn>=1.3",
    "sentence-transformers>=6.1.0",
    "spacy>=3.8",
    "torch>=2.14.1",
    "umap-learn>=0.5.12",
]

# torch en su variante CPU (feature 007, ADR 0009): sin CUDA, la imagen `mining` pesa ~1 GB menos.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }

[tool.coverage.run]
source = ["analytics"]
# Las técnicas que necesitan los modelos del grupo `mining` se miden en el job `analysis-eval`
# (`.coveragerc.mining`), no en `test-python` (plan de la 007, ajuste 16).
omit = [
    "*/analytics/mining/preprocess.py",
    "*/analytics/mining/keywords.py",
    "*/analytics/mining/cooccurrence.py",
    "*/analytics/mining/embeddings.py",
    "*/analytics/mining/topics.py",
    "*/analytics/mining/clusters.py",
    "*/analytics/mining/techniques.py",
    "*/analytics/mining/quality.py",
    "*/analytics/mining/duplicates.py",
]

[tool.coverage.report]
# Principio III de la constitución: cobertura mínima del 70 %.
fail_under = 70
show_missing = true
skip_covered = true
