# Contrato: specs/001-plataforma-base/contracts/ci-cd-pipeline.md
name: ci

on:
  pull_request:
  push:
    # Solo main: las ramas de feature se validan en su PR (evita ejecutar el CI dos veces).
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec eslint .
      - run: pnpm format:check
      - run: pnpm lint:py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Validar los mensajes de commit del PR
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La action descarga por defecto la 8.24.3, que ignora `[[allowlists]]` (sintaxis de la
          # 8.25+) en .gitleaks.toml. Misma versión que valida la configuración en local.
          GITLEAKS_VERSION: 8.30.1

  test-node:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
      # Bucket S3 para los respaldos de migraciones (Railway Buckets en staging/production).
      s3:
        image: rustfs/rustfs:1.0.0
        ports: ['9000:9000']
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    env:
      MONGO_TEST_URL: mongodb://localhost:27017
      REDIS_TEST_URL: redis://localhost:6379
      S3_TEST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Esperar al servidor S3
        run: scripts/wait-for-health.sh http://localhost:9000/health 60 2
      - run: pnpm --filter @reqcanvas/shared test
      - run: pnpm --filter @reqcanvas/api test:coverage
      - run: pnpm --filter @reqcanvas/web test
      - run: pnpm test:repo

  test-python:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      MONGO_TEST_URL: mongodb://localhost:27017
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # OCR de la detección (feature 006).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pnpm test:py

  # Gate de precisión de la detección (feature 006, SC-001 y SC-002) sobre los 20 diagramas
  # digitales del conjunto de validación. Se ejecuta siempre: tarda en torno a un minuto.
  detection-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv run --directory apps/analytics python tests/eval/evaluate_detection.py --subset digital --timing

  # Minería de texto (feature 007, plan ajuste 16): pruebas y gates con los modelos reales del
  # grupo `mining` (temas, duplicados, ambigüedad). Los modelos se guardan en la caché de Actions.
  analysis-eval:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ hashFiles('apps/analytics/uv.lock') }}
      - run: uv run --directory apps/analytics --group mining pytest tests/mining tests/unit/test_mining_run.py -q --cov --cov-config=.coveragerc.mining

  migrations:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URL: mongodb://localhost:27017
      MONGO_DB: ci_migrations
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: up → down → up (todas las migraciones son reversibles)
        working-directory: apps/api
        run: |
          pnpm migrate:up
          while pnpm -s migrate:status | grep -q APPLIED; do pnpm migrate:down; done
          pnpm migrate:up
          pnpm migrate:status

  build:
    name: build (${{ matrix.service }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            file: apps/api/Dockerfile
            max_mb: 300
          - service: analytics
            file: apps/analytics/Dockerfile
            max_mb: 1200
          # Minería de texto con los modelos incluidos (feature 007, ADR 0009).
          - service: analysis-worker
            file: apps/analytics/Dockerfile.mining
            max_mb: 3500
          - service: web
            file: apps/web/Dockerfile
            max_mb: 150
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          tags: reqcanvas-${{ matrix.service }}:ci
          load: true
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Tamaño de la imagen ≤ ${{ matrix.max_mb }} MB
        run: |
          size=$(docker image inspect reqcanvas-${{ matrix.service }}:ci --format '{{.Size}}')
          mb=$((size / 1024 / 1024))
          echo "reqcanvas-${{ matrix.service }}: ${mb} MB (límite ${{ matrix.max_mb }} MB)"
          test "$mb" -le "${{ matrix.max_mb }}"

  e2e-smoke:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v3
      # La imagen de minería (~3 GB) se toma de la caché del job `build` en lugar de construirla
      # aquí desde cero; Compose la usa por su nombre (perfil `mining`).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/analytics/Dockerfile.mining
          tags: reqcanvas-analysis-worker:local
          load: true
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=analysis-worker
      - name: Levantar el stack local
        run: |
          docker compose -f infra/docker-compose.yml build
          docker compose -f infra/docker-compose.yml --profile mining up -d --no-build --wait --wait-timeout 300
        env:
          # `/health/deep` exige el worker de minería (feature 007), que levanta el perfil `mining`.
          APP_VERSION: ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          EXPECTED_VERSION: ci
      - name: Logs de los servicios
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile mining logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - if: always()
        run: docker compose -f infra/docker-compose.yml --profile mining down -v
