# release-please mantiene un PR de release con el CHANGELOG. Al integrarlo crea el tag
# vX.Y.Z y despliega esa versión en production (con la aprobación del Environment).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # deploy.yml (invocado con workflow_call) declara un job que necesita `actions: read`; un
  # workflow invocado no puede pedir más permisos que quien lo invoca.
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Los tags creados con GITHUB_TOKEN no disparan otros workflows: se invoca deploy directamente.
  deploy-production:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
