# Contrato: specs/001-plataforma-base/contracts/ci-cd-pipeline.md
# Los despliegues se hacen SOLO desde aquí (constitución v1.1.0); el autodeploy de Railway
# está desactivado. Las migraciones las aplica el preDeployCommand de api en Railway
# (`migrate.js auto`) según MIGRATION_ACTION: respalda en el bucket antes de las destructivas,
# revierte (`down:<archivo>`) o restaura un respaldo (`restore:<clave>`). Sin `railway ssh`.
name: deploy

on:
  # staging: cada vez que el CI termina en verde sobre main.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # production: al crear un tag de release (release.yml lo invoca con workflow_call).
  workflow_call:
    inputs:
      environment: { type: string, required: true }
      ref: { type: string, required: true }
  # Manual: redespliegue / rollback a un ref concreto (docs/runbooks/rollback.md).
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Tag o SHA a desplegar (rollback = tag anterior)
        type: string
        default: main
      action:
        description: 'migrate-down: revierte las migraciones que `ref` no tiene (no despliega `ref`)'
        type: choice
        options: [deploy, migrate-down, restore-backup]
        default: deploy
      backup_key:
        description: 'restore-backup: clave del respaldo en el bucket (latest = el más reciente)'
        type: string
        default: latest

concurrency:
  # Los despliegues de un mismo entorno se ejecutan en orden, sin cancelarse.
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      ref: ${{ steps.plan.outputs.ref }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_ENV: ${{ inputs.environment }}
          IN_REF: ${{ inputs.ref }}
          IN_ACTION: ${{ inputs.action }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            env_name=staging; ref="$RUN_SHA"; action=deploy
          else
            env_name="$IN_ENV"; ref="$IN_REF"; action="${IN_ACTION:-deploy}"
          fi
          {
            echo "environment=$env_name"
            echo "ref=$ref"
            echo "action=$action"
          } >> "$GITHUB_OUTPUT"

  # deploy y restore-backup: restore-backup es un despliegue normal de `ref` cuyo
  # preDeployCommand restaura antes el respaldo.
  deploy:
    needs: plan
    if: needs.plan.outputs.action == 'deploy' || needs.plan.outputs.action == 'restore-backup'
    runs-on: ubuntu-latest
    # production exige la aprobación de los revisores del GitHub Environment (FR-009).
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: ${{ vars.BASE_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm install --global @railway/cli@4
      - name: Versión a desplegar
        id: version
        run: |
          {
            echo "commit=$(git rev-parse --short HEAD)"
            echo "version=$(git describe --tags --always)"
          } >> "$GITHUB_OUTPUT"
      - name: Acción de migraciones del despliegue (MIGRATION_ACTION)
        env:
          ACTION: ${{ needs.plan.outputs.action }}
          BACKUP_KEY: ${{ inputs.backup_key || 'latest' }}
        run: |
          # Se fija en cada despliegue para que un valor anterior nunca se reutilice.
          # El respaldo previo a las migraciones destructivas lo toma `migrate.js auto`.
          if [ "$ACTION" = "restore-backup" ]; then value="restore:$BACKUP_KEY"; else value=up; fi
          echo "MIGRATION_ACTION=$value"
          railway variables --service api --environment "$ENVIRONMENT" --skip-deploys \
            --set "MIGRATION_ACTION=$value" >/dev/null
      - name: Desplegar api, analytics y web
        run: |
          pids=""
          for service in analytics api web; do
            scripts/railway/deploy-service.sh "$service" "$ENVIRONMENT" \
              "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.commit }}" &
            pids="$pids $!"
          done
          # `wait` sin argumentos siempre devuelve 0: se espera cada proceso para propagar fallos.
          failed=0
          for pid in $pids; do wait "$pid" || failed=1; done
          exit "$failed"
      - name: Esperar a la versión nueva y a que web y api (con analytics) estén saludables
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # `railway up --ci` termina al acabar el build: la versión anterior sigue sirviendo
          # hasta que la nueva pasa su healthcheck. Se espera a ver la versión nueva:
          # api expone el commit en /version; web solo expone la versión en /config.js
          # (en un tag es `vX.Y.Z`, no el commit).
          scripts/wait-for-health.sh "${{ vars.API_URL }}/version" 900 10 "\"commit\":\"$COMMIT\""
          scripts/wait-for-health.sh "${{ vars.BASE_URL }}/config.js" 900 10 "\"version\":\"$VERSION\""
          scripts/wait-for-health.sh "${{ vars.BASE_URL }}/health" 120 5
          scripts/wait-for-health.sh "${{ vars.API_URL }}/health/deep" 120 5
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests contra ${{ env.ENVIRONMENT }}
        run: pnpm e2e
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ env.ENVIRONMENT }}
          path: playwright-report/

      - name: Volver a MIGRATION_ACTION=up tras la restauración
        if: always() && needs.plan.outputs.action == 'restore-backup'
        run: >
          railway variables --service api --environment "$ENVIRONMENT" --skip-deploys
          --set MIGRATION_ACTION=up >/dev/null

  # Revierte las migraciones que `ref` (la versión de destino) no tiene. Redespliega la versión
  # ACTUAL de api, que es la que contiene sus `down`, con MIGRATION_ACTION=down:<archivo>; el
  # preDeployCommand las revierte dentro de la red privada. Después se despliega `ref`.
  migrate-down:
    needs: plan
    if: needs.plan.outputs.action == 'migrate-down'
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ENVIRONMENT: ${{ needs.plan.outputs.environment }}
      TARGET_REF: ${{ needs.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: npm install --global @railway/cli@4
      - name: Versión desplegada y migraciones que revertir
        id: current
        run: |
          commit=$(curl -fsS "${{ vars.API_URL }}/version" | jq -r .commit)
          git checkout --quiet "$commit"
          file=$(scripts/first-new-migration.sh "$TARGET_REF" HEAD)
          echo "Desplegado: $commit · revertir desde: ${file:-(ninguna)}"
          {
            echo "commit=$commit"
            echo "version=$(git describe --tags --always)-migrate-down"
            echo "file=$file"
          } >> "$GITHUB_OUTPUT"
      - name: Redesplegar api con MIGRATION_ACTION=down
        if: steps.current.outputs.file != ''
        env:
          COMMIT: ${{ steps.current.outputs.commit }}
          VERSION: ${{ steps.current.outputs.version }}
          FILE: ${{ steps.current.outputs.file }}
        run: |
          railway variables --service api --environment "$ENVIRONMENT" --skip-deploys \
            --set "MIGRATION_ACTION=down:$FILE" >/dev/null
          scripts/railway/deploy-service.sh api "$ENVIRONMENT" "$VERSION" "$COMMIT"
          # Si el `down` falla, Railway no promueve el despliegue y esta espera agota el tiempo.
          scripts/wait-for-health.sh "${{ vars.API_URL }}/version" 600 10 "\"version\":\"$VERSION\""
          scripts/wait-for-health.sh "${{ vars.API_URL }}/health" 120 5
      - name: Volver a MIGRATION_ACTION=up
        if: always()
        run: >
          railway variables --service api --environment "$ENVIRONMENT" --skip-deploys
          --set MIGRATION_ACTION=up >/dev/null
