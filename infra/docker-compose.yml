# Entorno local completo: `pnpm dev:up` (desde la raíz). Web en :5173, API en :3000,
# analytics en :8000. MongoDB y Redis no se publican en el host (evita choques de puertos).
name: reqcanvas

x-node-healthcheck: &http-healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      <<: *http-healthcheck

  redis:
    image: redis:7
    # BullMQ exige noeviction (feature 002, plan ajuste 7); es el valor por defecto de Redis.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      <<: *http-healthcheck

  # Bucket S3 local (RustFS; en Railway, un Railway Bucket): imágenes de diagramas (feature 003).
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      <<: *http-healthcheck

  analytics:
    build:
      context: ..
      dockerfile: apps/analytics/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      ENV: development
      PORT: 8000
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: reqcanvas
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=2)',
        ]
      <<: *http-healthcheck

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
    # Igual que el preDeployCommand de Railway: migrar antes de arrancar.
    command: ['sh', '-c', 'node dist/migrate.js auto && exec node dist/server.js']
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: reqcanvas
      REDIS_URL: redis://redis:6379
      ANALYTICS_URL: http://analytics:8000
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      # En local y en CI, `accounts` activado para desarrollar y probar la feature 002.
      FEATURE_FLAGS: ${FEATURE_FLAGS:-accounts=true,diagrams=true,details=true}
      # Solo para desarrollo local; en Railway es un secreto por entorno.
      JWT_SECRET: dev-only-jwt-secret-not-for-production-use
      APP_BASE_URL: http://localhost:5173
      # Bucket local (feature 003, plan ajustes 2 y 3). RustFS no crea buckets: api lo crea.
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: reqcanvas
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
    ports:
      - '3000:3000'
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
      analytics: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      <<: *http-healthcheck

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      PORT: 8080
      # Proxy /api → api por la red de Compose (feature 002).
      API_INTERNAL_URL: http://api:3000
      API_PUBLIC_URL: http://localhost:3000
      APP_VERSION: ${APP_VERSION:-dev}
      # window.__canvasState para los E2E (feature 003, plan ajuste 8); nunca en Railway.
      E2E_HOOKS: 'true'
    ports:
      - '5173:8080'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      <<: *http-healthcheck

volumes:
  mongo-data:
  s3-data:
