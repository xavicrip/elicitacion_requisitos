# Servicios para las pruebas de integración (`pnpm test:services:up`), en los puertos por defecto
# de MONGO_TEST_URL, REDIS_TEST_URL y S3_TEST_URL. Independiente del stack de `pnpm dev:up`, que
# no publica MongoDB ni Redis en el host. En CI son los `services` de los jobs de ci.yml.
name: reqcanvas-test

x-healthcheck: &healthcheck
  interval: 2s
  timeout: 3s
  retries: 30

services:
  mongodb:
    image: mongo:7
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      <<: *healthcheck

  redis:
    image: redis:7
    # BullMQ exige noeviction (feature 002, plan ajuste 7); es el valor por defecto de Redis.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      <<: *healthcheck

  # Bucket S3 de los respaldos de migraciones (Railway Buckets en staging/production).
  s3:
    image: rustfs/rustfs:1.0.0
    ports: ['9000:9000']
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/health']
      <<: *healthcheck
